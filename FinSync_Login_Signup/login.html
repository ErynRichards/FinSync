
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinSync - Login</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- FinSync Logo and Name -->
        <div class="logo-container">

            <img src="images/finsync-logo.png"
                 alt="FinSync Logo"
                 class="logo">

            <span class="brand-name">FinSync</span>

        </div>

        <!-- Welcome Message -->
        <h1>Welcome back!</h1>

        <p class="subtitle">
            Login to continue to your account.
        </p>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Email Address -->
            <label for="loginEmail">Email Address</label>

            <input type="email"
                   id="loginEmail"
                   name="email"
                   required>

            <!-- Password -->
            <div class="password-heading">

                <label for="loginPassword">Password</label>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

            </div>

            <input type="password"
                   id="loginPassword"
                   name="password"
                   required>

            <!-- Login Button -->
            <button type="submit" class="main-button">
                Login
            </button>

        </form>

        <!-- Clickable Sign Up Link -->
        <div class="bottom-link">

            <a href="signup.html" class="account-link">
                Don't have an account?
            </a>

        </div>

    </div>

    <!-- Connect JavaScript -->
    <script src="auth.js"></script>

</body>

</html>
