<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinSync | Reset Password</title>

    <style>
        /* Colours and layout match the authentication designs. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #160b69;
            background: white;
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 35px 25px;
        }

        a {
            color: #160b69;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            text-decoration: none;
        }

        .brand {
            margin-bottom: 45px;
            font-size: 42px;
            font-weight: bold;
        }

        .layout {
            display: flex;
            align-items: center;
            gap: 70px;
        }

        .form-area {
            flex: 1;
            max-width: 520px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #5142c7;
            outline-offset: 2px;
        }

        input[aria-invalid="true"] {
            border-color: #b42318;
        }

        .field {
            margin-bottom: 20px;
        }

        .error {
            display: block;
            min-height: 20px;
            margin-top: 7px;
            color: #b42318;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #160b69;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2b1b92;
        }

        .message {
            line-height: 1.5;
            color: #245340;
        }

        .lock-picture {
            display: grid;
            place-items: center;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #334e6b;
            font-size: 110px;
        }

        .preview {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Make the form fit smaller screens. */
        @media (max-width: 700px) {
            .lock-picture {
                display: none;
            }

            h1 {
                font-size: 30px;
            }

            .layout {
                display: block;
            }
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main>
        <!-- Change this address if the group uses a different login route. -->
        <a class="back-link" href="/login">← Back to Login</a>

        <!-- The group's original logo can be added here later. -->
        <div class="brand">FinSync</div>

        <div class="layout">
            <div class="form-area">

                <!-- Screen 1: Request a password-reset email. -->
                <section id="forgotScreen">
                    <h1>Reset your password</h1>

                    <p class="description">
                        Enter your email address and we will send
                        you a link to reset your password.
                    </p>

                    <form id="forgotForm" novalidate>
                        <div class="field">
                            <label for="email">Email address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                aria-describedby="emailError"
                                required
                            >

                            <span
                                id="emailError"
                                class="error"
                                aria-live="polite"
                            ></span>
                        </div>

                        <button type="submit">Send Reset Link</button>

                        <p
                            id="forgotMessage"
                            class="message"
                            role="status"
                        ></p>
                    </form>
                </section>

                <!-- Screen 2: Choose and confirm a new password. -->
                <section id="resetScreen" hidden>
                    <h1>Create a new password</h1>

                    <p class="description" id="passwordHelp">
                        Use at least 7 characters, including an uppercase
                        letter, a lowercase letter and a number.
                    </p>

                    <form id="resetForm" novalidate>
                        <div class="field">
                            <label for="password">New password</label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                aria-describedby="passwordHelp passwordError"
                                required
                            >

                            <span
                                id="passwordError"
                                class="error"
                                aria-live="polite"
                            ></span>
                        </div>

                        <div class="field">
                            <label for="confirmPassword">
                                Confirm password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                autocomplete="new-password"
                                aria-describedby="confirmError"
                                required
                            >

                            <span
                                id="confirmError"
                                class="error"
                                aria-live="polite"
                            ></span>
                        </div>

                        <button type="submit">Reset Password</button>

                        <p
                            id="resetMessage"
                            class="message"
                            role="status"
                        ></p>
                    </form>
                </section>

                <!-- Preview links let us test both screens without a backend. -->
                <div class="preview">
                    Frontend preview only:
                    <a href="#forgot">Email screen</a> |
                    <a href="#reset">New password screen</a>
                </div>
            </div>

            <div class="lock-picture" aria-hidden="true">🔒</div>
        </div>
    </main>

    <script>
        /*
         * Reusable validation functions.
         * These return an error message, or an empty string when valid.
         * They can later be moved into a shared validation.js file.
         */
        const AuthValidation = {
            required(value, fieldName) {
                if (value.trim() === "") {
                    return fieldName + " is required.";
                }

                return "";
            },

            email(value) {
                const requiredError = this.required(value, "Email address");

                if (requiredError) {
                    return requiredError;
                }

                // Basic format check: text, @, domain and domain ending.
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(value.trim())) {
                    return "Enter a valid email address.";
                }

                return "";
            },

            password(value) {
                if (value.trim() === "") {
                    return "Password is required.";
                }

                if (value.length < 7) {
                    return "Use at least 7 characters.";
                }

                if (!/[A-Z]/.test(value)) {
                    return "Include at least one uppercase letter.";
                }

                if (!/[a-z]/.test(value)) {
                    return "Include at least one lowercase letter.";
                }

                if (!/[0-9]/.test(value)) {
                    return "Include at least one number.";
                }

                return "";
            },

            confirmPassword(password, confirmation) {
                if (confirmation.trim() === "") {
                    return "Please confirm your password.";
                }

                if (password !== confirmation) {
                    return "The passwords do not match.";
                }

                return "";
            }
        };

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirmPassword");

        const forgotMessage = document.getElementById("forgotMessage");
        const resetMessage = document.getElementById("resetMessage");

        // Show an error next to its input and mark the input as invalid.
        function showError(input, errorId, message) {
            document.getElementById(errorId).textContent = message;
            input.setAttribute("aria-invalid", message ? "true" : "false");
        }

        // Validate the email when the user submits the first form.
        document.getElementById("forgotForm").addEventListener(
            "submit",
            function (event) {
                // Stop the browser from reloading the page.
                event.preventDefault();
                forgotMessage.textContent = "";

                const error = AuthValidation.email(email.value);
                showError(email, "emailError", error);

                if (error) {
                    email.focus();
                    return;
                }

                /*
                 * Backend connection goes here.
                 * Do not claim an email was sent before the server responds.
                 */
                forgotMessage.textContent =
                    "Email format accepted. This preview does not send emails.";
            }
        );

        // Validate the new password and confirmation together.
        document.getElementById("resetForm").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                resetMessage.textContent = "";

                const passwordError =
                    AuthValidation.password(password.value);

                const confirmError = AuthValidation.confirmPassword(
                    password.value,
                    confirmation.value
                );

                showError(password, "passwordError", passwordError);
                showError(confirmation, "confirmError", confirmError);

                if (passwordError || confirmError) {
                    if (passwordError) {
                        password.focus();
                    } else {
                        confirmation.focus();
                    }

                    return;
                }

                /*
                 * The backend must verify the reset token and save
                 * the password securely before success is displayed.
                 */
                resetMessage.textContent =
                    "Validation passed. This preview has not changed your password.";

                // Clear passwords after this preview submission.
                document.getElementById("resetForm").reset();
            }
        );

        // Update an existing email error while the user corrects the input.
        email.addEventListener("input", function () {
            forgotMessage.textContent = "";

            if (email.getAttribute("aria-invalid") === "true") {
                showError(
                    email,
                    "emailError",
                    AuthValidation.email(email.value)
                );
            }
        });

        // Recheck errors when either password field changes.
        function updatePasswordErrors() {
            resetMessage.textContent = "";

            if (password.getAttribute("aria-invalid") === "true") {
                showError(
                    password,
                    "passwordError",
                    AuthValidation.password(password.value)
                );
            }

            if (confirmation.getAttribute("aria-invalid") === "true") {
                showError(
                    confirmation,
                    "confirmError",
                    AuthValidation.confirmPassword(
                        password.value,
                        confirmation.value
                    )
                );
            }
        }

        password.addEventListener("input", updatePasswordErrors);
        confirmation.addEventListener("input", updatePasswordErrors);

        // Switch between the two preview screens using the URL hash.
        function showScreen() {
            const showReset = window.location.hash === "#reset";

            document.getElementById("forgotScreen").hidden = showReset;
            document.getElementById("resetScreen").hidden = !showReset;

            forgotMessage.textContent = "";
            resetMessage.textContent = "";
        }

        window.addEventListener("hashchange", showScreen);
        showScreen();
    </script>
</body>
</html>
