<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinSync Transactions</title>

    <!-- Load the separate stylesheet and JavaScript file. -->
    <link rel="stylesheet" href="transactions.css">
    <script src="transactions.js" defer></script>
</head>

<body>
    <!-- Navigation links will connect to the group's Flask routes. -->
    <aside class="sidebar">
        <h2>FinSync</h2>

        <nav aria-label="Main navigation">
            <a href="/dashboard">Dashboard</a>
            <a href="transactions.html" class="active"
               aria-current="page">Transactions</a>
            <a href="/budgets">Budgets</a>
            <a href="/goals">Goals</a>
            <a href="/reports">Reports</a>
            <a href="/settings">Settings</a>
        </nav>
    </aside>

    <main>
        <h1>Transactions</h1>
        <p>View and manage your income and expenses.</p>

        <button id="openForm" type="button">
            + Add Transaction
        </button>

        <p class="note">
            Frontend preview: new records are cleared when you refresh.
        </p>

        <!-- Display confirmation messages without reloading the page. -->
        <p id="message" role="status"></p>

        <!-- Search and filters control which table rows are displayed. -->
        <section class="filters" aria-label="Search and filters">
            <div>
                <label for="search">Search</label>
                <input id="search" type="search"
                       placeholder="Description or category">
            </div>

            <div>
                <label for="typeFilter">Type</label>
                <select id="typeFilter">
                    <option value="">All transactions</option>
                    <option>Income</option>
                    <option>Expense</option>
                </select>
            </div>

            <div>
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All categories</option>
                </select>
            </div>

            <div>
                <label for="monthFilter">Month</label>
                <input id="monthFilter" type="month">
            </div>

            <button id="clearFilters" class="secondary" type="button">
                Clear filters
            </button>
        </section>

        <h2>Transaction history</h2>

        <!-- The container allows the table to scroll on small screens. -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Category</th>
                        <th scope="col">Description</th>
                        <th scope="col">Type</th>
                        <th scope="col">Amount (ZAR)</th>
                    </tr>
                </thead>

                <!-- JavaScript inserts the transaction rows here. -->
                <tbody id="transactionRows"></tbody>
            </table>
        </div>

        <p id="emptyMessage" hidden>No matching transactions.</p>
    </main>

    <!-- A dialog displays the Add Transaction form over the page. -->
    <dialog id="transactionDialog" aria-labelledby="formTitle">
        <form id="transactionForm">
            <h2 id="formTitle">Add Transaction</h2>

            <label for="type">Transaction type</label>
            <select id="type" required>
                <option>Expense</option>
                <option>Income</option>
            </select>

            <label for="amount">Amount (ZAR)</label>
            <input id="amount" type="number"
                   min="0.01" max="999999999.99" step="0.01"
                   placeholder="0.00" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select category</option>
            </select>

            <label for="description">Description</label>
            <input id="description" type="text" maxlength="150"
                   placeholder="E.g. Grocery shopping" required>

            <label for="date">Date</label>
            <input id="date" type="date"
                   min="1900-01-01" max="9999-12-31" required>

            <div class="form-buttons">
                <button id="cancelForm" class="secondary" type="button">
                    Cancel
                </button>

                <button type="submit">Save</button>
            </div>
        </form>
    </dialog>
</body>
</html>
