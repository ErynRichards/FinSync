{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<!-- Michalyn can restyle this page. Keep the form action and name="email". -->
<section class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email address you registered with and we'll send you a reset link.</p>
  {% include "_errors.html" %}

  <form method="post" action="{{ url_for('forgot_password') }}" data-validate="forgot" novalidate>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}">
    <button type="submit">Send reset link</button>
  </form>

  <p><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
</section>
{% endblock %}
