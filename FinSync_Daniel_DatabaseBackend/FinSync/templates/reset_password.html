{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<!-- Michalyn can restyle this page. Keep the form action and the names
     "password" and "confirm_password". -->
<section class="card">
  <h1>Choose a new password</h1>
  <p class="muted">At least 8 characters, with an uppercase letter, a lowercase letter,
     a number and a special character.</p>
  {% include "_errors.html" %}

  <form method="post" action="{{ url_for('reset_password', token=token) }}" data-validate="reset" novalidate>
    <label for="password">New password</label>
    <input id="password" name="password" type="password">

    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password">

    <button type="submit">Reset password</button>
  </form>

  <p><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
</section>
{% endblock %}
