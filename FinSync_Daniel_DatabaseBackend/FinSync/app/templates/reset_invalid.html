{% extends "base.html" %}
{% block title %}Link not valid{% endblock %}
{% block content %}
<section class="card">
  <h1>Link not valid</h1>
  <div class="alert alert-error" role="alert">{{ message }}</div>
  <p><a class="button" href="{{ url_for('password_reset.forgot_password') }}">Request a new link</a></p>
  <p><a href="{{ url_for('auth.login') }}">&larr; Back to login</a></p>
</section>
{% endblock %}
