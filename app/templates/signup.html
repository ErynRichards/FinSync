{% extends "base.html" %}
{# PLACEHOLDER - Lashanya (UI) and Mishayle (backend) replace this. #}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card">
  <h1>Create your account</h1>
  {% include "_errors.html" %}
  <form method="post" action="{{ url_for('auth.signup') }}" data-validate="signup" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" autocomplete="name" required
           maxlength="101" value="{{ full_name or '' }}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required
           maxlength="255" value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <p class="muted small">{{ rules }}</p>
    <button type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
