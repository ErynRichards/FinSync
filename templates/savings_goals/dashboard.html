<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savings Goals | FinSync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/savings_goals/savings_goals.css') }}">
  <!-- defer lets the browser finish reading the HTML before JavaScript uses it. -->
  <script src="{{ url_for('static', filename='js/savings_goals/savings_goals.js') }}" defer></script>
</head>
<body class="savings-page">
  <div class="savings-shell">
    <!-- Replace this sidebar with the shared FinSync sidebar when integrating.
         These example links should point to your team's actual page routes. -->

<!-- MISHAYLE: Shared FinSync sidebar design -->
<aside class="sidebar">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/transactions/logo.png') }}"
             alt="FinSync Logo">
        <h2>FinSync</h2>
    </div>

    <nav aria-label="FinSync navigation">
        <a class="nav-btn" href="/dashboard">Dashboard</a>
        <a class="nav-btn" href="/transactions">Transactions</a>
        <a class="nav-btn" href="/budgets">Budgets</a>
        <a class="nav-btn active" href="/savings-goals"
           aria-current="page">Savings Goals</a>
        <a class="nav-btn" href="/reports">Reports</a>
        <a class="nav-btn" href="/settings">Settings</a>
    </nav>

    <a class="logout" href="/logout">Logout</a>

</aside>


    <main class="savings-main">
      <!-- Decorative placeholders for the shared dashboard's account controls. -->
      <div class="account-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="white" stroke="#080c31">
          <path d="M12 3c-4 0-6 3-6 7v4l-3 4h18l-3-4v-4c0-4-2-7-6-7zm-2 17a2 2 0 0 0 4 0M12 1v2"></path>
        </svg>
        <span class="avatar">J</span>
      </div>
      <header class="savings-header">
        <div>
          <h1>Savings goals</h1>
          <p>Set your goals, track your progress and make your dream a reality</p>
        </div>
        <!-- Connect #add-goal to the separate Create Savings Goal form during integration. -->
        <button class="primary-button" id="add-goal" type="button">+ Add New Goal</button>
      </header>

      <!-- JavaScript calculates these four values from the same goals as the cards. -->
      <dl class="savings-summary" aria-label="Savings summary">
        <div><dt>Total Goals</dt><dd id="goal-count">—</dd></div>
        <div><dt>Total target amount</dt><dd id="total-target">—</dd></div>
        <div><dt>Total Saved</dt><dd id="total-saved">—</dd></div>
        <div><dt>Average progress</dt><dd id="average-progress">—</dd></div>
      </dl>

      <div class="savings-toolbar">
        <select id="sort-goals" aria-label="Sort goals">
          <option value="soonest">Target Date (soonest)</option>
          <option value="latest">Target Date (latest)</option>
        </select>
      </div>
      <p id="goals-message" role="status" hidden></p>
      <section id="goal-list" class="goal-grid" aria-label="Savings goals"></section>

      <!-- This template stays hidden until JavaScript clones it for each goal. -->
      <template id="goal-card">
        <article class="goal-card">
          <div class="goal-heading">
            <div><h2></h2><p class="goal-description"></p></div>
            <span class="goal-status"></span>
          </div>
          <div class="goal-progress">
            <div class="goal-percent" aria-hidden="true"></div>
            <progress max="100" value="0"></progress>
            <div class="goal-amounts"><span class="goal-saved"></span><span class="goal-target"></span></div>
          </div>
          <p class="goal-date">Target Date: <time></time></p>

        <!-- REECE: Monthly savings recommendation -->
        <p class="goal-monthly-recommendation"></p>

        <!-- ERYN: Add money to this savings goal -->
        <button type="button" class="contribute-btn">
            + Add Savings
        </button>
</article>
      </template>

      <!-- ERYN: Add Savings popup -->
      <dialog id="contribution-dialog" class="contribution-dialog" aria-labelledby="contribution-title">
        <form id="contribution-form">
          <h2 id="contribution-title">Add Savings</h2>
          <p id="contribution-goal-name"></p>
          <label for="contribution-amount">Amount (R)</label>
          <input id="contribution-amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
          <p id="contribution-error" role="alert"></p>
          <div class="contribution-actions">
            <button type="button" id="cancel-contribution">Cancel</button>
            <button type="submit" id="save-contribution" class="primary-button">Add Savings</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>
</body>
</html>
