{% extends "base.html" %}
{% block title %}Link not valid{% endblock %}
{% block content %}
<section class="card">
  <h1>Link not valid</h1>
  <div class="alert alert-error">{{ message }}</div>
  <p><a class="button" href="{{ url_for('forgot_password') }}">Request a new link</a></p>
  <p><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
</section>
{% endblock %}
