<!DOCTYPE html>
<html lang="en">

<head>
    <!-- REECE: Load the saved theme across FinSync -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinSync - Create Budget</title>


    <!-- ERYN: Original Create Budget styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/budgets/createBudget.css') }}">
    <!-- REECE: Shared light and dark mode styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body>

    <!-- Main page container -->
    <main class="budget-page">

        <!-- White form card -->
        <section class="budget-card">

            <!-- Navigation back to Budgets dashboard -->
            <a href="{{ url_for('budgets_page') }}" class="back-btn">
                &larr; Back to Budgets
            </a>

            <h1>Create Budget</h1>

            <!-- Budget creation form -->
            <form id="budgetForm">

                <!-- Category selection -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category"
                            name="category"
                            required>

                        <option value="" disabled selected>
                            Select category
                        </option>

                        <!-- Expense categories are loaded from Flask. -->
                    </select>
                </div>

                <!-- Monthly budget amount -->
                <div class="form-group">

                    <label for="monthlyAmount">
                        Monthly Amount (R)
                    </label>

<!-- Let the user enter or choose a value. -->
                    <input
                        type="number"
                        id="monthlyAmount"
                        name="monthlyAmount"
                        placeholder="0.00"
                        min="0.01"
                        step="0.01"
                        required>
                </div>

                <!-- Suggested budget feature -->
                <div class="suggestion-box"
                     id="suggestionBox">

                    <h3>
                        Suggested Monthly Budget
                    </h3>

                    <!-- Loading, information and error messages -->
                    <p id="suggestionMessage"
                       aria-live="polite">
                        Select a category to view
                        your suggested budget.
                    </p>

                    <!-- Suggested amount and button -->
                    <div class="suggestion-result"
                         id="suggestionResult"
                         hidden>

                        <strong id="suggestedAmount">
                            R 0.00
                        </strong>

<!-- Run an action when this button is clicked. -->
                        <button
                            type="button"
                            id="useAmountBtn">
                            Use Amount
                        </button>

                    </div>

                </div>

                <!-- Start date -->
                <div class="form-group">

                    <label for="startDate">
                        Start Date
                    </label>

<!-- Let the user enter or choose a value. -->
                    <input
                        type="date"
                        id="startDate"
                        name="startDate"
                        required>

                </div>

                <!-- End date -->
                <div class="form-group">

                    <label for="endDate">
                        End Date
                    </label>

<!-- Let the user enter or choose a value. -->
                    <input
                        type="date"
                        id="endDate"
                        name="endDate"
                        required>

                </div>

                <!-- Form feedback -->
                <p id="formMessage"
                   role="status"
                   aria-live="polite"></p>

                <!-- Form buttons -->
                <div class="form-actions">

                    <a href="{{ url_for('budgets_page') }}"
                       class="cancel-btn">
                        Cancel
                    </a>

<!-- Run an action when this button is clicked. -->
                    <button
                        type="submit"
                        id="saveBudgetBtn"
                        class="save-btn">
                        Save
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- Link JavaScript -->
    <script src="{{ url_for('static', filename='js/budgets/createBudget.js') }}"></script>

</body>
</html>
